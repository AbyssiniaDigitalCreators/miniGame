<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>miniGame</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #1f2937;
      color: #f9fafb;
    }

    .game {
      width: min(90vw, 500px);
      padding: 1rem;
      background: #111827;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    .hud {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      font-weight: 700;
    }

    .arena {
      position: relative;
      height: 280px;
      border: 2px solid #374151;
      border-radius: 8px;
      background: linear-gradient(145deg, #1e3a8a, #312e81);
      overflow: hidden;
      cursor: crosshair;
    }

    .target {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #f59e0b;
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.2);
      cursor: pointer;
    }

    .controls {
      margin-top: 0.75rem;
      display: flex;
      gap: 0.5rem;
      align-items: center;
      justify-content: space-between;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 0.5rem 0.9rem;
      font-weight: 700;
      color: #111827;
      background: #34d399;
      cursor: pointer;
    }

    .status {
      font-size: 0.9rem;
      color: #d1d5db;
      margin: 0;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>miniGame: Hit the Dot</h1>
    <div class="hud">
      <span id="score">Score: 0</span>
      <span id="time">Time: 20</span>
    </div>
    <div class="arena" id="arena" aria-label="Game arena">
      <button class="target" id="target" aria-label="Target"></button>
    </div>
    <div class="controls">
      <button id="start">Start / Restart</button>
      <p class="status" id="status">Press start to play.</p>
    </div>
  </main>

  <script>
    const arena = document.getElementById('arena');
    const target = document.getElementById('target');
    const scoreLabel = document.getElementById('score');
    const timeLabel = document.getElementById('time');
    const statusLabel = document.getElementById('status');
    const startButton = document.getElementById('start');

    const GAME_SECONDS = 20;
    let score = 0;
    let timeLeft = GAME_SECONDS;
    let timerId = null;

    function placeTarget() {
      const maxX = arena.clientWidth - target.offsetWidth;
      const maxY = arena.clientHeight - target.offsetHeight;
      const x = Math.floor(Math.random() * Math.max(maxX, 1));
      const y = Math.floor(Math.random() * Math.max(maxY, 1));

      target.style.left = `${x}px`;
      target.style.top = `${y}px`;
    }

    function updateHud() {
      scoreLabel.textContent = `Score: ${score}`;
      timeLabel.textContent = `Time: ${timeLeft}`;
    }

    function endGame() {
      clearInterval(timerId);
      timerId = null;
      target.hidden = true;
      statusLabel.textContent = `Time up! Final score: ${score}`;
    }

    function startGame() {
      score = 0;
      timeLeft = GAME_SECONDS;
      updateHud();
      statusLabel.textContent = 'Click the dot as many times as you can.';
      target.hidden = false;
      placeTarget();

      clearInterval(timerId);
      timerId = setInterval(() => {
        timeLeft -= 1;
        updateHud();
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    target.addEventListener('click', () => {
      if (!timerId) {
        return;
      }

      score += 1;
      updateHud();
      placeTarget();
    });

    startButton.addEventListener('click', startGame);
    target.hidden = true;
    updateHud();
  </script>
</body>
</html>
